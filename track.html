<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Track Order – GNITS Canteen</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>

<nav>
  <div class="logo">🍽️ GNITS <span>Canteen</span></div>
  <ul>
    <li><a href="menu.html">Explore</a></li>
    <li><a href="specials.html">Today's Picks</a></li>
    <li><a href="track.html" class="active">Track Order</a></li>
    <li><a href="history.html">Your Orders</a></li>
    <li><a href="reviews.html">Reviews</a></li>
  </ul>
  <button class="cart-btn" style="background:#fff3;color:#fff;" onclick="logout()">Logout</button>
</nav>

<div class="container">
  <div class="page-header">
    <h1>📍 Track Your Orders</h1>
    <p>Live status of your active orders</p>
  </div>
  <div id="track-wrap"></div>
</div>

<!-- Bottom Nav -->
<nav class="bottom-nav">
  <a href="menu.html"><span class="bn-icon">🍽️</span>Explore</a>
  <a href="specials.html"><span class="bn-icon"></span>Today's Picks</a>
  <a href="track.html" class="active"><span class="bn-icon"></span>Track</a>
  <a href="history.html"><span class="bn-icon"></span>Your Orders</a>
  <a href="reviews.html"><span class="bn-icon"></span>Reviews</a>
</nav>

<div id="toast" class="toast"></div>
<script src="js/menu.js"></script>
<script type="module">
import "./js/app.js";

window.addEventListener("DOMContentLoaded", () => {

  window.requireAuth((user) => {

    const roll =
      user.email
        .replace("@gnitscanteen.com", "")
        .toUpperCase();

    const STATUSES = [
      "Placed",
      "Preparing",
      "Ready"
    ];

    function statusIndex(s) {
      return STATUSES.indexOf(s);
    }

    async function getFirebaseOrders() {

      const ref =
        window.doc(
          window.db,
          "erp_users",
          roll
        );

      const snap =
        await window.getDoc(ref);

      if (!snap.exists())
        return [];

      const data =
        snap.data();

      return data.orders || [];

    }

    async function render() {

      const orders =
        await getFirebaseOrders();

      const active =
        orders.filter(order => {

          if (order.status !== "Ready")
            return true;

          return (
            Date.now() - order.placedAt
            < (Number(order.waitMins || 0) + 10) * 60000
          );

        });

      const wrap =
        document.getElementById("track-wrap");

      if (active.length === 0) {

        wrap.innerHTML = `
          <div class="empty-state">
            <div class="icon">🍽️</div>
            <p>No active orders right now.</p>
          </div>
        `;

        return;
      }

      wrap.innerHTML =
        active.map(order => {

          const si =
            statusIndex(order.status);

          return `
            <div class="order-track-card">

              <div class="ot-header">

                <div>
                  <div style="font-weight:600;">
                    ${(order.items || []).map(i => i.item).join(", ")}
                  </div>

                  <div class="ot-id">
                    Receipt: ${order.id}
                  </div>
                </div>

                <div style="display:flex;flex-direction:column;align-items:flex-end;gap:0.3rem;">
                  <span class="wait-badge">
                    ⏱ ~${order.waitMins} mins
                  </span>

                  <span style="font-size:0.78rem;color:var(--muted);">
                    ${order.orderType === "Parcel" ? "📦 Parcel" : "🍽️ Dine In"}
                  </span>
                </div>

              </div>

              <div class="status-bar">

                ${STATUSES.map((s, i) => `

                  <div class="status-step ${i < si ? "done" : i === si ? "active" : ""}">

                    <div class="dot">
                      ${i < si ? "✓" : i + 1}
                    </div>

                    <div class="label">
                      ${s}
                    </div>

                  </div>

                  ${i < STATUSES.length - 1
                    ? `<div class="status-line ${i < si ? "done" : ""}"></div>`
                    : ""
                  }

                `).join("")}

              </div>

              <div style="
                margin-top:1rem;
                display:flex;
                justify-content:space-between;
              ">
                <span>
                  ₹${order.total}
                </span>

                <span style="color:var(--muted);">
                  ${window.fmtDate(order.placedAt)}
                </span>
              </div>

            </div>
          `;

        }).join("");

    }

    render();

    setInterval(render, 5000);

  });

});
</script>
</body>
</html>
