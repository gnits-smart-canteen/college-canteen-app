<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Receipt – GNITS Canteen</title>
  <link rel="stylesheet" href="css/style.css"/>
  <style>
    @media print {
      nav, .btn-print, .btn-track { display: none !important; }
      body { background: #fff; }
    }
  </style>
</head>
<body>

<nav>
  <div class="logo">🍽️ GNITS <span>Canteen</span></div>
  <ul>
    <li><a href="menu.html">Menu</a></li>
    <li><a href="track.html">Track Order</a></li>
    <li><a href="history.html">My Orders</a></li>
  </ul>
  <button class="cart-btn" style="background:#fff3;color:#fff;" onclick="logout()">Logout</button>
</nav>

<div class="container">
  <div id="receipt-wrap"></div>
</div>

<div id="toast" class="toast"></div>
<script src="js/menu.js"></script>
<script type="module" src="js/app.js"></script>
<script>

window.addEventListener('DOMContentLoaded', () => {

  requireAuth((user) => {

    const orderId =
      localStorage.getItem('sc_last_order');

  if (!orderId) {
    window.location.href = 'menu.html';
    return;
  }

  const order = getOrders().find(o => o.id === orderId);

  if (!order) {
    document.getElementById('receipt-wrap').innerHTML = `
      <div class="empty-state">
        <div class="icon">🧾</div>
        <p>Receipt not found.</p>
      </div>
    `;
    return;
  }

  const studentName =
  order.studentName || order.roll;

  function render() {

    document.getElementById('receipt-wrap').innerHTML =`

      <div class="receipt-card">

        <div class="r-header">

          <div class="r-logo">
            🍽️ GNITS Smart Canteen
          </div>

          <div style="font-size:0.82rem;color:#888;margin-top:0.2rem;">
            G. Narayanamma Institute of Technology and Science
          </div>

          <div class="r-id">
            Receipt No:
            <strong>${order.id}</strong>
          </div>

          <div class="r-id">
            ${fmtDate(order.placedAt)}
          </div>

        </div>

        <div class="r-row">
          <span>Student</span>
          <span>${studentName} (${order.roll})</span>
        </div>

        <div class="r-row">
          <span>Order Type</span>
          <span style="font-weight:600;color:var(--primary);">
            ${order.orderType === 'Parcel'
              ? '📦 Parcel'
              : '🍽️ Dine In'}
          </span>
        </div>

        <div class="r-row">
          <span>Payment</span>
          <span>UPI ✅</span>
        </div>

        <div style="margin:0.8rem 0;border-top:1.5px dashed var(--border);padding-top:0.8rem;">

          ${order.items.map(i => `

            <div class="r-row">
              <span>${i.item} × ${i.qty}</span>
              <span>₹${i.price * i.qty}</span>
            </div>

          `).join('')}

        </div>

        <div class="r-row r-total">
          <span>Total Paid</span>
          <span>₹${order.total}</span>
        </div>

        <div class="r-row"
          style="font-size:0.82rem;color:var(--muted);">

          <span>Est. Wait</span>
          <span>~${order.waitMins} mins</span>

        </div>

        <div class="r-footer">
          Thank you for ordering! 🙏<br/>

          <span style="font-size:0.78rem;">
            Keep this receipt for reference.
          </span>
        </div>

        <button class="btn-print"
          onclick="window.print()">

          🖨️ Print Receipt

        </button>

        <button class="btn-print btn-track"
          style="background:var(--success);margin-top:0.5rem;"
          onclick="window.location.href='track.html'">

          📍 Track My Order

        </button>

      </div>

    `;

  }

      render();

  });

});

</script>
</body>
</html>
