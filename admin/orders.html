<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Live Orders – GNITS Canteen Admin</title>
  <link rel="stylesheet" href="../css/style.css"/>
</head>
<body>

<nav class="admin-nav">
  <div class="logo">🍽️ GNITS <span>Admin</span></div>
  <ul>
    <li><a href="orders.html" class="active">Live Orders</a></li>
    <li><a href="specials.html">Daily Specials</a></li>
    <li><a href="dashboard.html">Dashboard</a></li>
  </ul>
  <span style="color:#aaa;font-size:0.85rem;">Owner Panel</span>
</nav>

<div class="container">
  <div class="page-header">
    <h1>📋 Live Orders</h1>
    <p>Update order status in real time</p>
  </div>

  <div style="display:flex;gap:0.5rem;margin-bottom:1rem;flex-wrap:wrap;">
    <button class="cat-tab active" id="filter-all" onclick="setFilter('all')">All</button>
    <button class="cat-tab" id="filter-Placed" onclick="setFilter('Placed')">Placed</button>
    <button class="cat-tab" id="filter-Preparing" onclick="setFilter('Preparing')">Preparing</button>
    <button class="cat-tab" id="filter-Ready" onclick="setFilter('Ready')">Ready</button>
  </div>

  <div style="overflow-x:auto;">
    <table class="orders-table" id="orders-table">
      <thead>
        <tr>
          <th>Receipt ID</th>
          <th>Student</th>
          <th>Items</th>
          <th>Type</th>
          <th>Total</th>
          <th>Wait</th>
          <th>Placed At</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="orders-body"></tbody>
    </table>
  </div>
  <div id="empty-orders" class="empty-state" style="display:none;"><div class="icon">📋</div><p>No orders yet.</p></div>
</div>

<div id="toast" class="toast"></div>
<script type="module">
  // 1. Import your Firebase functions
  import {
    getOrders,
    getUsers,
    updateOrderStatus
  } from "../js/firebase-admin.js";

  let currentFilter = 'all';

  // 2. Define the core logic
  async function render() {
    try {
      // Both getUsers and getOrders are safely available inside this module scope
      const users = await getUsers();
      let orders = await getOrders();
      
      if (currentFilter !== 'all') {
        orders = orders.filter(o => o.status === currentFilter);
      }
      
      const tbody = document.getElementById('orders-body');
      const empty = document.getElementById('empty-orders');

      if (orders.length === 0) {
        tbody.innerHTML = '';
        empty.style.display = 'block';
        return;
      }
      empty.style.display = 'none';

      // Simple date formatting helper if you don't have one globally defined
      const fmtDate = (d) => d ? new Date(d).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '';

      tbody.innerHTML = orders.map(o => `
        <tr>
          <td style="font-size:0.78rem;">${o.id}</td>
          <td>${users[o.roll]?.name || o.roll}<br/><span style="font-size:0.75rem;color:#aaa;">${o.roll}</span></td>
          <td style="max-width:200px;">${o.items.map(i => `${i.item} ×${i.qty}`).join(', ')}</td>
          <td>${o.orderType === 'Parcel' ? '📦 Parcel' : '🍽️ Dine In'}</td>
          <td style="font-weight:700;color:var(--primary);">₹${o.total}</td>
          <td>~${o.waitMins}m</td>
          <td style="font-size:0.8rem;">${fmtDate(o.placedAt)}</td>
          <td>
            <select class="status-select" onchange="window.changeStatus('${o.id}', this.value)">
              <option ${o.status === 'Placed' ? 'selected' : ''}>Placed</option>
              <option ${o.status === 'Preparing' ? 'selected' : ''}>Preparing</option>
              <option ${o.status === 'Ready' ? 'selected' : ''}>Ready</option>
            </select>
          </td>
        </tr>`).join('');
    } catch (error) {
      console.error("Error rendering orders:", error);
    }
  }

  function setFilter(f) {
    currentFilter = f;
    document.querySelectorAll('.cat-tab').forEach(b => b.classList.remove('active'));
    document.getElementById('filter-' + f)?.classList.add('active');
    render();
  }

  async function changeStatus(id, status) {
    const orders = await getOrders();
    const order = orders.find(o => o.id === id);
    if (order) {
      await updateOrderStatus(order.roll, id, status);
      if (typeof toast === "function") {
        toast(`Order ${id.slice(-6)} → ${status}`);
      }
      render();
    }
  }

  // Helper for your toast notification element if needed
  function toast(msg) {
    const el = document.getElementById('toast');
    if (el) {
      el.innerText = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 3000);
    }
  }

  // 3. Expose interaction functions to the HTML window scope
  window.setFilter = setFilter;
  window.changeStatus = changeStatus;

  // 4. Run immediately and poll every 10 seconds
  render();
  setInterval(render, 10000);
</script>
</body>
</html>
