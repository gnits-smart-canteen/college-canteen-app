<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Live Orders – GNITS Canteen Admin</title>
  <link rel="stylesheet" href="../css/style.css"/>
</head>
<body>

<nav class="admin-nav">
  <div class="logo">🍽️ GNITS <span>Admin</span></div>
  <ul>
    <li><a href="orders.html" class="active">Live Orders</a></li>
    <li><a href="specials.html">Daily Specials</a></li>
    <li><a href="dashboard.html">Dashboard</a></li>
  </ul>
  <span style="color:#aaa;font-size:0.85rem;">Owner Panel</span>
</nav>

<div class="container">
  <div class="page-header">
    <h1>📋 Live Orders</h1>
    <p>Update order status in real time</p>
  </div>

  <div style="display:flex;gap:0.5rem;margin-bottom:1rem;flex-wrap:wrap;">
    <button class="cat-tab active" id="filter-all" onclick="setFilter('all')">All</button>
    <button class="cat-tab" id="filter-Placed" onclick="setFilter('Placed')">Placed</button>
    <button class="cat-tab" id="filter-Preparing" onclick="setFilter('Preparing')">Preparing</button>
    <button class="cat-tab" id="filter-Ready" onclick="setFilter('Ready')">Ready</button>
  </div>

  <div style="overflow-x:auto;">
    <table class="orders-table" id="orders-table">
      <thead>
        <tr>
          <th>Receipt ID</th>
          <th>Student</th>
          <th>Items</th>
          <th>Type</th>
          <th>Total</th>
          <th>Wait</th>
          <th>Placed At</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="orders-body"></tbody>
    </table>
  </div>
  <div id="empty-orders" class="empty-state" style="display:none;"><div class="icon">📋</div><p>No orders yet.</p></div>
</div>

<div id="toast" class="toast"></div>
<script src="../js/app.js"></script>
<script>
  let currentFilter = 'all';

  function setFilter(f) {
    currentFilter = f;
    document.querySelectorAll('.cat-tab').forEach(b => b.classList.remove('active'));
    document.getElementById('filter-' + f)?.classList.add('active');
    render();
  }

  function render() {
    let orders = getOrders();
    if (currentFilter !== 'all') orders = orders.filter(o => o.status === currentFilter);
    const users = getUsers();
    const tbody = document.getElementById('orders-body');
    const empty = document.getElementById('empty-orders');

    if (orders.length === 0) {
      tbody.innerHTML = '';
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';

    tbody.innerHTML = orders.map(o => `
      <tr>
        <td style="font-size:0.78rem;">${o.id}</td>
        <td>${users[o.roll]?.name || o.roll}<br/><span style="font-size:0.75rem;color:#aaa;">${o.roll}</span></td>
        <td style="max-width:200px;">${o.items.map(i => `${i.item} ×${i.qty}`).join(', ')}</td>
        <td>${o.orderType === 'Parcel' ? '📦 Parcel' : '🍽️ Dine In'}</td>
        <td style="font-weight:700;color:var(--primary);">₹${o.total}</td>
        <td>~${o.waitMins}m</td>
        <td style="font-size:0.8rem;">${fmtDate(o.placedAt)}</td>
        <td>
          <select class="status-select" onchange="changeStatus('${o.id}', this.value)">
            <option ${o.status === 'Placed' ? 'selected' : ''}>Placed</option>
            <option ${o.status === 'Preparing' ? 'selected' : ''}>Preparing</option>
            <option ${o.status === 'Ready' ? 'selected' : ''}>Ready</option>
          </select>
        </td>
      </tr>`).join('');
  }

  function changeStatus(id, status) {
    updateOrderStatus(id, status);
    toast(`Order ${id.slice(-6)} → ${status}`);
    render();
  }

  render();
  setInterval(render, 10000);
</script>
</body>
</html>
