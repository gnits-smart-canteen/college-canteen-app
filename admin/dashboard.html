<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard – GNITS Canteen Admin</title>
  <link rel="stylesheet" href="../css/style.css"/>
</head>
<body>

<nav class="admin-nav">
  <div class="logo">🍽️ GNITS <span>Admin</span></div>
  <ul>
    <li><a href="orders.html">Live Orders</a></li>
    <li><a href="specials.html">Daily Specials</a></li>
    <li><a href="dashboard.html" class="active">Dashboard</a></li>
  </ul>
  <span style="color:#aaa;font-size:0.85rem;">Owner Panel</span>
</nav>

<div class="container">
  <div class="flex-between" style="margin-bottom:1.5rem;">
    <div class="page-header" style="margin-bottom:0;">
      <h1>📊 Analytics Dashboard</h1>
      <p id="dash-date"></p>
    </div>
    <div style="display:flex;gap:0.5rem;align-items:center;">
      <select id="date-filter" onchange="render()" style="padding:0.5rem 0.8rem;border:1.5px solid var(--border);border-radius:8px;font-size:0.9rem;outline:none;">
        <option value="today">Today</option>
        <option value="all">All Time</option>
      </select>
      <button onclick="exportCSV()" style="padding:0.5rem 1rem;background:var(--primary);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:0.88rem;font-weight:600;">⬇ Export CSV</button>
    </div>
  </div>

  <!-- Stat Cards -->
  <div class="stat-grid" id="stat-grid"></div>

  <!-- Charts Row -->
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;margin-bottom:2rem;" id="charts-row">
    <div style="background:#fff;border-radius:12px;padding:1.5rem;box-shadow:var(--shadow);border:1.5px solid var(--border);">
      <div style="font-weight:600;margin-bottom:1rem;">Top 10 Items Ordered</div>
      <div class="bar-chart" id="top-items-chart"></div>
    </div>
    <div style="background:#fff;border-radius:12px;padding:1.5rem;box-shadow:var(--shadow);border:1.5px solid var(--border);">
      <div style="font-weight:600;margin-bottom:1rem;">Revenue by Category</div>
      <div class="bar-chart" id="cat-chart"></div>
    </div>
  </div>

  <!-- Order Type Split -->
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;margin-bottom:2rem;">
    <div style="background:#fff;border-radius:12px;padding:1.5rem;box-shadow:var(--shadow);border:1.5px solid var(--border);">
      <div style="font-weight:600;margin-bottom:1rem;">Dine In vs Parcel</div>
      <div id="type-split"></div>
    </div>
    <div style="background:#fff;border-radius:12px;padding:1.5rem;box-shadow:var(--shadow);border:1.5px solid var(--border);">
      <div style="font-weight:600;margin-bottom:1rem;">Orders by Status</div>
      <div id="status-split"></div>
    </div>
  </div>

  <!-- All Orders Table -->
  <div style="background:#fff;border-radius:12px;padding:1.5rem;box-shadow:var(--shadow);border:1.5px solid var(--border);">
    <div style="font-weight:600;margin-bottom:1rem;">All Orders</div>
    <div style="overflow-x:auto;">
      <table class="orders-table" id="all-orders-table">
        <thead>
          <tr>
            <th>Receipt ID</th><th>Student</th><th>Items</th><th>Type</th><th>Total</th><th>Status</th><th>Time</th>
          </tr>
        </thead>
        <tbody id="all-orders-body"></tbody>
      </table>
    </div>
    <div id="no-orders" class="empty-state" style="display:none;"><div class="icon">📋</div><p>No orders for this period.</p></div>
  </div>
</div>

<div id="toast" class="toast"></div>
<script src="../js/menu.js"></script>

<script type="module">
import {
  getOrders,
  getUsers
} from "../js/firebase-admin.js";

document.getElementById("dash-date").textContent =
  new Date().toLocaleDateString("en-IN", {
    weekday: "long",
    year: "numeric",
    month: "long",
    day: "numeric"
  });

function fmtDate(ts) {
  return new Date(ts).toLocaleString("en-IN", {
    dateStyle: "medium",
    timeStyle: "short"
  });
}

function getAllMenuItems() {
  return (window.MENU || []).flatMap(cat => {
    if (cat.groups) {
      return cat.groups.flatMap(group =>
        group.items.map(item => ({
          ...item,
          category: cat.category,
          group: group.name
        }))
      );
    }

    if (cat.items) {
      return cat.items.map(item => ({
        ...item,
        category: cat.category
      }));
    }

    return [];
  });
}

function getCategoryByItemId(id) {
  const item = getAllMenuItems().find(m => m.id === id);
  return item?.category || "Other";
}

async function getFilteredOrders() {
  const all = await getOrders();

  const filter =
    document.getElementById("date-filter").value;

  if (filter === "today") {
    const today = new Date();
    today.setHours(0, 0, 0, 0);

    return all.filter(o =>
      o.placedAt >= today.getTime()
    );
  }

  return all;
}

window.render = async function () {
  const orders = await getFilteredOrders();
  const users = await getUsers();

  const totalRevenue =
    orders.reduce((s, o) => s + Number(o.total || 0), 0);

  const totalOrders = orders.length;

  const avgOrder =
    totalOrders
      ? Math.round(totalRevenue / totalOrders)
      : 0;

  const uniqueStudents =
    new Set(orders.map(o => o.roll)).size;

  const dineIn =
  orders.filter(o =>
    !o.orderType ||
    o.orderType === "Dine In"
  ).length;

  const parcel =
  orders.filter(o =>
    o.orderType === "Parcel"
  ).length;

  document.getElementById("stat-grid").innerHTML =
    [
      { val: "₹" + totalRevenue, label: "Total Revenue" },
      { val: totalOrders, label: "Total Orders" },
      { val: "₹" + avgOrder, label: "Avg Order Value" },
      { val: uniqueStudents, label: "Unique Students" },
      { val: dineIn, label: "Dine In Orders" },
      { val: parcel, label: "Parcel Orders" }
    ].map(s => `
      <div class="stat-card">
        <div class="s-val">${s.val}</div>
        <div class="s-label">${s.label}</div>
      </div>
    `).join("");

  const itemCount = {};

  orders.forEach(o => {
    (o.items || []).forEach(i => {
      itemCount[i.item] =
        (itemCount[i.item] || 0) + Number(i.qty || 0);
    });
  });

  const topItems =
    Object.entries(itemCount)
      .sort((a, b) => b[1] - a[1])
      .slice(0, 10);

  const maxItem = topItems[0]?.[1] || 1;

  document.getElementById("top-items-chart").innerHTML =
    topItems.length
      ? topItems.map(([name, cnt]) => `
        <div class="bar-row">
          <div class="bar-label">${name}</div>
          <div class="bar-fill-wrap">
            <div class="bar-fill" style="width:${(cnt / maxItem) * 100}%">
              ${cnt}
            </div>
          </div>
          <div class="bar-val">${cnt}</div>
        </div>
      `).join("")
      : `<div class="text-muted">No data</div>`;

  const catRev = {};

  orders.forEach(o => {
    (o.items || []).forEach(i => {
      const cat = getCategoryByItemId(i.id);
      catRev[cat] =
        (catRev[cat] || 0) + Number(i.price || 0) * Number(i.qty || 0);
    });
  });

  const catEntries =
    Object.entries(catRev)
      .sort((a, b) => b[1] - a[1]);

  const maxCat = catEntries[0]?.[1] || 1;

  document.getElementById("cat-chart").innerHTML =
    catEntries.length
      ? catEntries.map(([cat, rev]) => `
        <div class="bar-row">
          <div class="bar-label">${cat}</div>
          <div class="bar-fill-wrap">
            <div class="bar-fill" style="width:${(rev / maxCat) * 100}%">
              ₹${rev}
            </div>
          </div>
          <div class="bar-val">₹${rev}</div>
        </div>
      `).join("")
      : `<div class="text-muted">No data</div>`;

  document.getElementById("type-split").innerHTML = `
    <div style="display:flex;gap:1.5rem;align-items:center;justify-content:center;padding:1rem 0;">
      <div style="text-align:center;">
        <div style="font-size:2rem;">🍽️</div>
        <div style="font-size:1.5rem;font-weight:700;color:var(--primary);">${dineIn}</div>
        <div style="color:var(--muted);font-size:0.85rem;">Dine In</div>
      </div>

      <div style="font-size:1.5rem;color:#ddd;">|</div>

      <div style="text-align:center;">
        <div style="font-size:2rem;">📦</div>
        <div style="font-size:1.5rem;font-weight:700;color:var(--primary);">${parcel}</div>
        <div style="color:var(--muted);font-size:0.85rem;">Parcel</div>
      </div>
    </div>
  `;

  const statusCount = {
    Placed: 0,
    Preparing: 0,
    Ready: 0
  };

  orders.forEach(o => {
    if (statusCount[o.status] !== undefined) {
      statusCount[o.status]++;
    }
  });

  document.getElementById("status-split").innerHTML =
    Object.entries(statusCount).map(([s, c]) => `
      <div style="display:flex;justify-content:space-between;padding:0.5rem 0;border-bottom:1px solid var(--border);">
        <span class="badge badge-${s.toLowerCase()}">${s}</span>
        <span style="font-weight:600;">${c} orders</span>
      </div>
    `).join("");

  const tbody =
    document.getElementById("all-orders-body");

  const noOrders =
    document.getElementById("no-orders");

  if (!orders.length) {
    tbody.innerHTML = "";
    noOrders.style.display = "block";
    return;
  }

  noOrders.style.display = "none";

  tbody.innerHTML =
    orders.map(o => `
      <tr>
        <td style="font-size:0.75rem;">${o.id}</td>

        <td>
          ${users[o.roll]?.name || o.roll}
          <br>
          <span style="font-size:0.75rem;color:#aaa;">${o.roll}</span>
        </td>

        <td style="max-width:180px;font-size:0.82rem;">
          ${(o.items || []).map(i => `${i.item} ×${i.qty}`).join(", ")}
        </td>

        <td>
          ${o.orderType === "Parcel" ? "📦 Parcel" : "🍽️ Dine In"}
        </td>

        <td style="font-weight:700;color:var(--primary);">
          ₹${o.total}
        </td>

        <td>
          <span class="badge badge-${o.status.toLowerCase()}">
            ${o.status}
          </span>
        </td>

        <td style="font-size:0.8rem;">
          ${fmtDate(o.placedAt)}
        </td>
      </tr>
    `).join("");
};

window.exportCSV = async function () {
  const orders = await getFilteredOrders();
  const users = await getUsers();

  const rows = [
    [
      "Receipt ID",
      "Student",
      "Roll No",
      "Items",
      "Order Type",
      "Total",
      "Status",
      "Payment",
      "Time"
    ]
  ];

  orders.forEach(o => {
    rows.push([
      o.id,
      users[o.roll]?.name || o.roll,
      o.roll,
      (o.items || []).map(i => `${i.item}x${i.qty}`).join(" | "),
      o.orderType,
      o.total,
      o.status,
      o.payment,
      fmtDate(o.placedAt)
    ]);
  });

  const csv =
    rows.map(r =>
      r.map(v => `"${String(v ?? "").replaceAll('"', '""')}"`).join(",")
    ).join("\n");

  const blob =
    new Blob([csv], { type: "text/csv" });

  const a =
    document.createElement("a");

  a.href =
    URL.createObjectURL(blob);

  a.download =
    `gnits-canteen-orders-${new Date().toISOString().slice(0,10)}.csv`;

  a.click();
};

await window.render();
</script>
</body>
</html>
