<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Your Orders – GNITS Canteen</title>

  <link rel="stylesheet" href="css/style.css"/>
  <link rel="icon" href="data:,">
</head>

<body>

<!-- NAVBAR -->
<nav>
  <div class="logo">
    🍽️ GNITS <span>Canteen</span>
  </div>

  <ul>
    <li><a href="menu.html">Explore</a></li>
    <li><a href="specials.html">Today's Picks</a></li>
    <li><a href="track.html">Track Order</a></li>
    <li><a href="history.html" class="active">Your Orders</a></li>
    <li><a href="reviews.html">Reviews</a></li>
  </ul>

  <button
    class="cart-btn"
    style="background:#fff3;color:#fff;"
    onclick="window.logout()"
  >
    Logout
  </button>
</nav>

<!-- PAGE -->
<div class="container">

  <div class="page-header">
    <h1>🧾 Your Orders</h1>
    <p>
      All your previous canteen orders
    </p>
  </div>

  <div id="history-wrap"></div>

</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay">

  <div class="modal">

    <button
      class="btn-close"
      onclick="closeModal()"
    >
      ✕
    </button>

    <div id="modal-content"></div>

  </div>

</div>

<div id="toast" class="toast"></div>

<script src="js/menu.js"></script>

<script type="module">

import { auth } from "./js/firebase-config.js";
import "./js/app.js";

let roll = "";

// WAIT FOR AUTH
import {
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

window.addEventListener("DOMContentLoaded", () => {

  onAuthStateChanged(auth, (user) => {

    if (!user) {

      window.location.href = "index.html";
      return;

    }

    roll = window.getCurrentUser();
    console.log("ROLL =", roll);
    render();

  });

});

// RENDER HISTORY
async function render() {

  const ref =
    window.doc(
      window.db,
      "erp_users",
      roll
    );

  const snap =
    await window.getDoc(ref);

  const data =
    snap.exists()
      ? snap.data()
      : {};

  const orders =
    data.orders || [];

  const wrap =
    document.getElementById("history-wrap");

  if (orders.length === 0) {

    wrap.innerHTML = `
      <div class="empty-state">
        <div class="icon">🍽️</div>
        <p>
          No orders yet.<br/>
          <a href="menu.html"
             style="color:var(--primary);font-weight:600;">
             Start ordering!
          </a>
        </p>
      </div>
    `;

    return;
  }

  wrap.innerHTML = orders.map(order => `
    <div
      class="history-card"
      onclick="showReceipt('${order.id}')"
    >

      <div class="h-top">

        <div>

          <div style="font-weight:700;font-size:1rem;">
            ${order.items.map(i => i.item).join(", ")}
          </div>

          <div class="h-id">
            Receipt: ${order.id}
          </div>

        </div>

        <div style="text-align:right;">

          <div class="h-total">
            ₹${order.total}
          </div>

          <div style="font-size:0.78rem;margin-top:0.25rem;">
            <span class="badge badge-${order.status.toLowerCase()}">
              ${order.status}
            </span>
          </div>

        </div>

      </div>

      <div style="
        display:flex;
        justify-content:space-between;
        margin-top:0.8rem;
      ">

        <div class="h-date">
          ${window.fmtDate(order.placedAt)}
        </div>

        <div style="
          font-size:0.8rem;
          color:var(--muted);
        ">
          💵 Cash
        </div>

      </div>

    </div>
  `).join("");

  window.firebaseOrders = orders;

}
// RECEIPT MODAL
window.showReceipt = function(id) {

  const order =
    window.getOrders()
      .find(o => o.id === id);

  if (!order) return;

  document.getElementById(
    "modal-content"
  ).innerHTML = `

    <div style="
      text-align:center;
      border-bottom:
        2px dashed var(--border);

      padding-bottom:1rem;
      margin-bottom:1rem;
    ">

      <div style="
        font-size:1.2rem;
        font-weight:700;
        color:var(--primary);
      ">
        🍽️ GNITS Smart Canteen
      </div>

      <div style="
        font-size:0.78rem;
        color:#888;
      ">

        Receipt No:
        <strong>${order.id}</strong>

      </div>

      <div style="
        font-size:0.78rem;
        color:#888;
      ">

        ${window.fmtDate(order.placedAt)}

      </div>

    </div>

    ${order.items.map(i => `

      <div style="
        display:flex;
        justify-content:space-between;
        padding:0.35rem 0;
      ">

        <span>
          ${i.item} × ${i.qty}
        </span>

        <span>
          ₹${i.price * i.qty}
        </span>

      </div>

    `).join("")}

    <div style="
      display:flex;
      justify-content:space-between;

      margin-top:1rem;
      padding-top:1rem;

      border-top:
        1.5px solid var(--border);

      font-weight:700;
      font-size:1rem;
    ">

      <span>Total</span>

      <span>
        ₹${order.total}
      </span>

    </div>

    <button
      class="btn-print"
      style="margin-top:1rem;"
      onclick="window.print()"
    >
      🖨️ Print Receipt
    </button>

  `;

  document
    .getElementById("modal-overlay")
    .classList.add("open");

};

// CLOSE MODAL
window.closeModal = function() {

  document
    .getElementById("modal-overlay")
    .classList.remove("open");

};

</script>

</body>
</html>
